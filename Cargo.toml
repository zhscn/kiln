[workspace]
resolver = "3"
members = ["rust/kiln-rt", "rust/kiln-cg", "rust/kiln-launcher"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "BSD-2-Clause"

[workspace.dependencies]
kiln-rt = { path = "rust/kiln-rt" }
kiln-cg = { path = "rust/kiln-cg" }
mmtk = { version = "0.33", default-features = false }
libc = "0.2"
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-module = "0.137"
cranelift-jit = "0.137"
cranelift-object = "0.137"
cranelift-native = "0.137"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Dependencies (Cranelift, MMTk, num) are optimized in debug builds too:
# JIT-compiling the kernel and CLOS modules is otherwise slow.
[profile.dev.package."*"]
opt-level = 2

# kiln-cg reads and lowers tens of megabytes of KIR for the CLOS module,
# and kiln-rt runs its initialization: optimize them in debug builds too
# (debug assertions stay on).
[profile.dev.package.kiln-cg]
opt-level = 2

[profile.dev.package.kiln-rt]
opt-level = 2

# MMTk's debug assertions check every side-metadata access: with them the
# GC took a third of the time of kiln compiling its kernel.
[profile.dev.package.mmtk]
debug-assertions = false
overflow-checks = false
